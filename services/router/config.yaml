# ════════════════════════════════════════════════════════════════════
# 9Router Sidecar Configuration — oh-my-class
# ════════════════════════════════════════════════════════════════════
#
# COMBO NAME MAPPING:
# ┌──────────┬─────────────────┬─────────────────────────────────┐
# │ Combo    │ Providers       │ Use Case                        │
# ├──────────┼─────────────────┼─────────────────────────────────┤
# │ f.light  │ Kiro, OpenCode  │ Fast, free, lightweight         │
# │ f.pro    │ Kiro, OpenCode  │ Best quality, free tier         │
# └──────────┴─────────────────┴─────────────────────────────────┘
#
# LiteLLM model names map to these combos:
# gpt-5.4            → f.pro
# deepseek-v4-flash  → f.light
# deepseek-free      → f.light
# content-fusion     → f.pro (fusion)
# deepseek-compressed → f.light (RTK)
# ════════════════════════════════════════════════════════════════════

combos:
  # ═══ f.light ═══ Fast, free tier models ═══
  # Used by: deepseek-v4-flash (planner, researcher), deepseek-free (content creator)
  f.light:
    strategy: free-tier
    providers:
      - kiro-ai        # AWS Builder ID — Claude 4.5 free tier
      - opencode       # OpenCode free tier
    priority: [kiro-ai, opencode]
    fallback_within_combo: true

  # ═══ f.pro ═══ Best quality, free tier ═══
  # Used by: gpt-5.4 (lead agent), content-fusion (reviewer)
  f.pro:
    strategy: free-tier
    providers:
      - kiro-ai        # Claude 4.5
      - opencode       # Free model
      - vertex-ai      # Vertex AI $300 one-time credit
    priority: [kiro-ai, opencode, vertex-ai]
    fallback_within_combo: true

  # ═══ f.pro (fusion) ═══ Parallel providers + judge ═══
  # Used by: content-fusion (reviewer — needs high accuracy)
  content-fusion:
    strategy: fusion
    providers:
      - kiro-ai        # Claude 4.5
      - opencode       # Free model
    judge: kiro-ai
    require_majority: true
    # Maps to 9Router combo: f.pro (fusion mode)

  # ═══ f.light (RTK) ═══ Token compression ═══
  # Used by: deepseek-compressed (tool-heavy content gen)
  deepseek-compressed:
    strategy: rtk-compress
    providers:
      - kiro-ai
      - opencode
    compression_ratio: 0.20-0.40
    # Maps to 9Router combo: f.light (RTK mode)

providers:
  kiro-ai:
    base_url: https://api.kiro.ai/v1
    api_key: env:KIRO_AI_API_KEY
    description: "AWS Builder ID — Claude 4.5 free tier"
  opencode:
    base_url: https://api.opencode.ai/v1
    api_key: env:OPENCODE_API_KEY
    description: "OpenCode free tier"
  vertex-ai:
    base_url: https://us-central1-aiplatform.googleapis.com/v1
    api_key: env:VERTEX_AI_API_KEY
    project: env:VERTEX_AI_PROJECT
    description: "Google Vertex AI — $300 one-time credit"

# Health monitoring
healthcheck:
  interval_seconds: 30
  timeout_seconds: 10
  failure_threshold: 3

# Alerting
alerts:
  slack_webhook: env:SLACK_WEBHOOK_URL
  alert_on:
    - provider_down
    - all_providers_down
    - free_tier_exhausted
    - high_latency
