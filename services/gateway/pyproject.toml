[project]
name = "services.gateway"
version = "0.1.0"
description = "FastAPI gateway for oh-my-class pipeline"
requires-python = ">=3.12"
dependencies = [
    "packages.agents",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "PyJWT>=2.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
