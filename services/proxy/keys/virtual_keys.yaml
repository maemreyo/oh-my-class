# ════════════════════════════════════════════════════════════════════
# Virtual key configuration per agent
# ════════════════════════════════════════════════════════════════════
#
# MODEL → 9Router COMBO MAPPING:
# gpt-5.4            → f.pro
# deepseek-v4-flash  → f.light
# deepseek-free      → f.light
# content-fusion     → f.pro (fusion)
# deepseek-compressed → f.light (RTK)
#
# ALL keys route through 9Router. Budget caps = $0 for safety.
# Real budget management happens at 9Router level (free tier quotas).
# ════════════════════════════════════════════════════════════════════

virtual_keys:
  - key_name: lead-agent
    models: ["gpt-5.4"]          # → 9Router combo: f.pro
    max_budget: 0
    rpm_limit: 100
    tpm_limit: 500000

  - key_name: planner
    models: ["deepseek-v4-flash"]  # → 9Router combo: f.light
    max_budget: 0
    rpm_limit: 200
    tpm_limit: 1000000

  - key_name: researcher
    models: ["deepseek-v4-flash"]  # → 9Router combo: f.light
    max_budget: 0
    rpm_limit: 200
    tpm_limit: 1000000

  - key_name: content-creator
    models: ["deepseek-free", "deepseek-compressed"]  # → f.light (both)
    max_budget: 0
    rpm_limit: 100
    tpm_limit: 500000

  - key_name: reviewer
    models: ["content-fusion", "gpt-5.4"]  # → f.pro (fusion + direct)
    max_budget: 0
    rpm_limit: 50
    tpm_limit: 200000
