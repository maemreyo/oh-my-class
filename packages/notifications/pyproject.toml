[project]
name = "packages.notifications"
version = "0.1.0"
description = "Pluggable notification channels for oh-my-class approval gates"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "pydantic-settings>=2.14.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
