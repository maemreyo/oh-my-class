[project]
name = "packages.agents"
version = "0.1.0"
description = "LangGraph multi-agent pipeline for oh-my-class"
requires-python = ">=3.12"
dependencies = [
    "common.contracts",
    "langgraph>=1.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
