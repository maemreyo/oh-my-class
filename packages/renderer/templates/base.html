<!DOCTYPE html>
<html lang="<%= it.lang || 'vi' %>">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title><%= it.title || 'oh-my-class' %> — oh-my-class</title>
  <style>
    /* oh-my-class theme: <%= it.theme || 'default' %> */
    <%- it.themeCSS %>
    .omc-header { padding: 1rem 0; border-bottom: 2px solid var(--color-border, #e2e8f0); margin-bottom: 1.5rem; }
    .omc-header .brand { font-weight: 700; color: var(--color-primary, #3b82f6); }
    .omc-header .title { font-size: 1.5rem; font-weight: 600; margin: 0.5rem 0 0.25rem; }
    .omc-header .meta { color: var(--color-text-muted, #64748b); font-size: 0.875rem; }
    .omc-footer { margin-top: 2rem; padding-top: 1rem; border-top: 1px solid var(--color-border, #e2e8f0); color: var(--color-text-muted, #64748b); font-size: 0.875rem; }
  </style>
</head>
<body>
  <header class="omc-header">
    <div class="brand">oh-my-class</div>
    <div class="title"><%= it.title %></div>
    <% if (it.subject || it.gradeLevel) { %>
    <div class="meta">
      <% if (it.subject) { %><span class="subject"><%= it.subject %></span><% } %>
      <% if (it.gradeLevel) { %> · <span class="grade"><%= it.gradeLevel %></span><% } %>
    </div>
    <% } %>
  </header>

  <main>
    <%~ it.content %>
  </main>

  <footer class="omc-footer">
    <span>Generated by oh-my-class</span>
  </footer>
</body>
</html>
