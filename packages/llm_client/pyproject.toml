[project]
name = "packages.llm_client"
version = "0.1.0"
description = "LLM client wrapper for oh-my-class — wraps openai.AsyncOpenAI, build_tags(), MockLLMClient"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.0.0",
    "pydantic-settings>=2.14.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
