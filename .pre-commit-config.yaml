# oh-my-class pre-commit hooks
# Run locally before push — not just in CI

repos:
  # ── Python ──
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.0
    hooks:
      - id: mypy
        additional_dependencies: [pydantic, pydantic-settings]
        args: [--config-file=pyproject.toml]
        files: ^(packages|common|services)/.*\.py$

  # ── Import Linter (Python) ──
  - repo: local
    hooks:
      - id: import-linter
        name: import-linter
        entry: lint-imports
        language: system
        files: \.py$
        pass_filenames: false

  # ── Type Checking (Python) ──
  - repo: local
    hooks:
      - id: basedpyright
        name: basedpyright
        entry: scripts/typecheck.sh
        language: script
        pass_filenames: false
        always_run: true

  # ── TypeScript ──
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v9.9.0
    hooks:
      - id: eslint
        files: \.(ts|tsx)$
        args: [--fix]

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        files: \.(ts|tsx|json|yaml|yml)$

  # ── Dependency Cruiser (TypeScript) ──
  - repo: local
    hooks:
      - id: dependency-cruiser
        name: dependency-cruiser
        entry: depcruise --validate .dependency-cruiser.cjs .
        language: system
        files: \.(ts|tsx)$
        pass_filenames: false

  # ── General ──
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: no-commit-to-branch
        args: [--branch, main]
