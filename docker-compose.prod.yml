# Production overlay — adds LiteLLM + Postgres + Redis
# Run with: docker compose -f docker-compose.yml -f docker-compose.prod.yml up
# Single switch vs local: LLM_CLIENT_BASE_URL becomes http://litellm:4000

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: litellm
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  litellm:
    image: ghcr.io/berriai/litellm-database:main-stable
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      9router:
        condition: service_healthy
    ports:
      - "4000:4000"
    volumes:
      - ./infra/litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD}@db:5432/litellm
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4000/health/readiness || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Override app to route through LiteLLM in production
  app:
    depends_on:
      litellm:
        condition: service_healthy
    environment:
      LLM_CLIENT_BASE_URL: http://litellm:4000  # via LiteLLM in production

volumes:
  pgdata:
  redis_data:
