name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck-python:
    name: "Python Type Check (basedpyright)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install basedpyright
      - run: bash scripts/typecheck.sh

  lint-imports-python:
    name: "Python Import Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install import-linter
      - run: lint-imports

  lint-no-raw-gateway-calls:
    name: "No Raw Gateway Calls"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv run python scripts/check_no_raw_gateway_calls.py

  lint-deps-typescript:
    name: "TypeScript Dependency Cruise"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g dependency-cruiser
      - run: depcruise --validate .dependency-cruiser.cjs .

  verify-schema-parity:
    name: "Schema Parity (Pydantic → Zod)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g pnpm
      - run: pnpm install --frozen-lockfile
      - run: uv run python scripts/generate_zod_schemas.py
      - run: uv run python scripts/verify_schema_parity.py
      - run: python scripts/verify_frontend_api_contracts.py
      - run: uv run python scripts/verify_theme_drift.py

  test-python:
    name: "Python Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e packages/agents -e packages/quality -e common/contracts -e services/gateway
      - run: python scripts/check_env_drift.py
      - run: python scripts/verify_registry_drift.py
      - run: python scripts/verify_new_component_tests.py
      - run: pytest tests/test_parked_status_ttl.py --tb=short
      - run: pytest --tb=short
      - run: pytest packages/agents/tests --cov=packages/agents --cov-fail-under=85
      - run: pytest common/contracts/tests --cov=common/contracts --cov-fail-under=95
      - run: pytest packages/quality/tests --cov=packages/quality --cov-fail-under=90
      - run: pytest packages/quality -m property -v

  test-typescript:
    name: "TypeScript Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm --filter @oh-my-class/renderer test:coverage
      - run: pnpm --filter @oh-my-class/web exec playwright install chromium --with-deps
      - run: pnpm --filter @oh-my-class/web test:e2e

  build-docker:
    name: "Docker Build"
    runs-on: ubuntu-latest
    needs: [lint-imports-python, lint-deps-typescript, test-python, test-typescript]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f infra/compose/docker-compose.yml build
