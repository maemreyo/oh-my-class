strategy_families:
  - family_id: vocabulary_language
    version: "1.0.0"
    lifecycle: production
    production_selectable: true
    labels:
      en: "Vocabulary and language"
      vi: "Từ vựng và ngôn ngữ"
    subject_tags: [language]
    required_learning_move_ids: [semantic_discrimination]
    scoring_profile_id: evidence_balanced_default
  - family_id: exam_assessment_prep
    version: "1.0.0"
    lifecycle: production
    production_selectable: true
    labels:
      en: "Exam and assessment prep"
      vi: "Ôn thi và kiểm tra"
    subject_tags: [exam_prep, math, science]
    required_learning_move_ids: [exam_error_probe]
    scoring_profile_id: evidence_balanced_default
  - family_id: concept_math_science
    version: "1.0.0"
    lifecycle: production
    production_selectable: true
    labels:
      en: "Concept math and science"
      vi: "Khái niệm toán và khoa học"
    subject_tags: [math, science, concept]
    required_learning_move_ids: [concept_model_build]
    scoring_profile_id: evidence_balanced_default

scoring_profiles:
  - scoring_profile_id: evidence_balanced_default
    version: "1.0.0"
    fallback_only: false
    weights:
      objective_alignment: 0.4
      evidence_signal_coverage: 0.3
      component_diversity: 0.2
      compliance_safety: 0.1
  - scoring_profile_id: evidence_balanced_basic
    version: "1.0.0"
    fallback_only: true
    weights:
      objective_alignment: 0.5
      evidence_signal_coverage: 0.3
      component_diversity: 0.1
      compliance_safety: 0.1

fallback_policies:
  - policy_id: text_table_fallback
    version: "1.0.0"
    lifecycle: production
    fallback_policy: required
    from_component_type: contrastive_pairs
    to_component_type: table
    preserved_affordances: [representation, print_safe]
    lost_affordances: [side_by_side_discrimination]
    fallback_quality: 0.72
    reason_code: compact_print_layout
    teacher_message: "Use a compact table when contrastive pair layout cannot be safely filled or rendered."
    severity: warning
    teacher_options: [accept_table_fallback, revise_component_feedback]
  - policy_id: vocab_cluster_table_fallback
    version: "1.0.0"
    lifecycle: production
    fallback_policy: required
    from_component_type: vocab_cluster
    to_component_type: table
    preserved_affordances: [representation, grouping]
    lost_affordances: [concept_map_visual_shape]
    fallback_quality: 0.68
    reason_code: compact_print_layout
    teacher_message: "Use a grouped table when the vocabulary cluster component is unavailable."
    severity: warning
    teacher_options: [accept_table_fallback, revise_component_feedback]
  - policy_id: flow_step_fallback
    version: "1.0.0"
    lifecycle: production
    fallback_policy: required
    from_component_type: flow_step
    to_component_type: table
    preserved_affordances: [ordered_steps, print_safe]
    lost_affordances: [guided_flow_visual]
    fallback_quality: 0.7
    reason_code: low_visual_space
    teacher_message: "Use an ordered table when the flow-step component cannot fit the delivery/export constraints."
    severity: warning
    teacher_options: [accept_table_fallback, revise_component_feedback]
  - policy_id: question_card_fallback
    version: "1.0.0"
    lifecycle: production
    fallback_policy: required
    from_component_type: question_list
    to_component_type: question_card
    preserved_affordances: [retrieval_practice, answer_key_separation]
    lost_affordances: [grouped_item_set]
    fallback_quality: 0.8
    reason_code: small_item_count
    teacher_message: "Use question cards when a full question list would overrun the approved item budget."
    severity: info
    teacher_options: [accept_question_card_fallback, revise_item_budget]

contraindications:
  - rule_id: avoid_high_duration_for_short_lessons
    version: "1.0.0"
    lifecycle: production
    priority: 10
    component_type: question_list
    condition: duration_under_20_minutes
    override_allowed: true

rationale_templates:
  - template_id: default_teacher_rationale
    version: "1.0.0"
    labels:
      en: "Chosen because it fits the objective, evidence, and artifact format."
      vi: "Được chọn vì phù hợp mục tiêu, bằng chứng và định dạng học liệu."
